name: Deploy Astro to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # false en vez de true: si cae un push mientras el despliegue anterior
  # sigue en curso, se deja terminar en vez de cancelarlo a la mitad.
  # Cancelar un despliegue de Pages a medias es una causa conocida de
  # "Deployment failed, try again later." en el siguiente intento.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build with Astro
        env:
          # S puede sobreescribir definiendo la variable de repositorio
          # PUBLIC_API_URL en GitHub → Settings → Secrets and variables →
          # Actions → Variables. Si no se define, AppHead.astro usa el
          # fallback ya hardcodeado con la URL real de Render.
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: npm run build

      # Prepara/valida el sitio de Pages (origen, base path, etc.) antes de
      # subir el artifact. Parte de la plantilla oficial de GitHub.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4